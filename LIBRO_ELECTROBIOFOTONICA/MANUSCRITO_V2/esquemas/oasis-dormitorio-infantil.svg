<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1440" viewBox="0 0 2400 1440" role="img" aria-labelledby="title desc">
  <title id="title">Cómo convertir un dormitorio infantil o adolescente en un Oasis Electromagnético</title>
  <desc id="desc">Comparación entre una habitación con móvil en la cama, monitor demasiado próximo, cargadores y router, y otra organizada con dispositivos fuera, monitor alejado, iluminación gradual y SPIRO Disc delante del router fuera del dormitorio.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#607985"/></marker>
    <style>
      .title { font: 700 60px Arial, Helvetica, sans-serif; fill: #16313F; }
      .subtitle { font: 400 28px Arial, Helvetica, sans-serif; fill: #4B646F; }
      .panel { font: 700 36px Arial, Helvetica, sans-serif; fill: #16313F; }
      .label { font: 700 24px Arial, Helvetica, sans-serif; fill: #16313F; }
      .body { font: 400 22px Arial, Helvetica, sans-serif; fill: #3F5964; }
      .small { font: 600 19px Arial, Helvetica, sans-serif; fill: #4B646F; }
      .room { fill: #F8FBFC; stroke: #B4C6CD; stroke-width: 5; }
      .line { fill: none; stroke: #607985; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .good { fill: none; stroke: #287A68; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .bad { fill: none; stroke: #B94D3E; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="2400" height="1440" fill="#FFFFFF"/>
  <text x="1200" y="88" text-anchor="middle" class="title">DORMITORIO INFANTIL: DEL ACUMULAR AL ORGANIZAR</text>
  <text x="1200" y="137" text-anchor="middle" class="subtitle">La cama es el centro del plano: retira, aleja, revisa e integra solo lo necesario</text>

  <g transform="translate(90,210)">
    <rect width="980" height="955" rx="34" class="room"/>
    <rect x="0" y="0" width="980" height="105" rx="34" fill="#F7E4E1"/>
    <text x="490" y="67" text-anchor="middle" class="panel">ANTES · TODO DUERME AQUÍ</text>

    <g transform="translate(110,245)">
      <rect x="0" y="160" width="570" height="280" rx="32" fill="#E8F0F4" stroke="#607985" stroke-width="6"/>
      <rect x="0" y="120" width="140" height="110" rx="25" fill="#FFFFFF" stroke="#607985" stroke-width="6"/>
      <path d="M0 440 V510 M570 440 V510" class="line"/>
      <path d="M75 310 C170 270 355 270 510 330" stroke="#C8D9E0" stroke-width="42" stroke-linecap="round" fill="none"/>
      <rect x="180" y="137" width="75" height="120" rx="18" fill="#16313F"/>
      <rect x="191" y="152" width="53" height="85" rx="8" fill="#6FA4BB"/>
      <circle cx="218" cy="246" r="5" fill="#FFFFFF"/>
      <text x="218" y="105" text-anchor="middle" class="label">Móvil en la cama</text>
      <path d="M335 125 V35 H425 V125" class="bad"/>
      <rect x="350" y="40" width="60" height="70" rx="10" fill="#D85D4A"/>
      <circle cx="380" cy="67" r="9" fill="#FFFFFF"/>
      <text x="510" y="51" class="label">Monitor cerca</text>
      <text x="510" y="82" class="small">y cable accesible</text>

      <rect x="610" y="285" width="150" height="80" rx="14" fill="#DDECF2" stroke="#1D5D82" stroke-width="5"/>
      <line x1="635" y1="305" x2="635" y2="345" stroke="#1D5D82" stroke-width="6"/><line x1="670" y1="305" x2="670" y2="345" stroke="#1D5D82" stroke-width="6"/><line x1="705" y1="305" x2="705" y2="345" stroke="#1D5D82" stroke-width="6"/>
      <path d="M760 325 C830 325 825 465 755 465 H590 C530 465 560 515 505 515" class="line"/>
      <text x="685" y="260" text-anchor="middle" class="label">Router en la habitación</text>

      <rect x="35" y="525" width="360" height="78" rx="18" fill="#FFF0D8" stroke="#D18B39" stroke-width="5"/>
      <circle cx="78" cy="564" r="18" fill="#D18B39"/>
      <text x="235" y="557" text-anchor="middle" class="label">Regleta y cargadores</text>
      <text x="235" y="586" text-anchor="middle" class="small">junto al colchón</text>
      <path d="M410 565 C505 610 590 520 690 570" class="bad"/>
      <text x="700" y="550" class="label">Cables bajo</text>
      <text x="700" y="581" class="label">la cama</text>
    </g>

    <rect x="95" y="850" width="790" height="68" rx="24" fill="#F7E4E1"/>
    <text x="490" y="894" text-anchor="middle" class="body">Fuentes activas, luz tardía y objetos sin una función nocturna</text>
  </g>

  <path d="M1100 680 H1280" fill="none" stroke="#607985" stroke-width="8" marker-end="url(#arrow)"/>
  <text x="1190" y="630" text-anchor="middle" class="label">MÉTODO</text>
  <text x="1190" y="660" text-anchor="middle" class="small">OASIS</text>

  <g transform="translate(1330,210)">
    <rect width="980" height="955" rx="34" class="room"/>
    <rect x="0" y="0" width="980" height="105" rx="34" fill="#E6F3EE"/>
    <text x="490" y="67" text-anchor="middle" class="panel">DESPUÉS · LA NOCHE TIENE SITIO</text>

    <g transform="translate(75,220)">
      <rect x="130" y="190" width="570" height="280" rx="32" fill="#E8F0F4" stroke="#607985" stroke-width="6"/>
      <rect x="130" y="150" width="140" height="110" rx="25" fill="#FFFFFF" stroke="#607985" stroke-width="6"/>
      <path d="M130 470 V540 M700 470 V540" class="line"/>
      <path d="M205 340 C300 300 485 300 640 360" stroke="#C8D9E0" stroke-width="42" stroke-linecap="round" fill="none"/>
      <path d="M280 135 C330 80 500 80 550 135" stroke="#287A68" stroke-width="7" stroke-dasharray="14 14" fill="none"/>
      <text x="415" y="60" text-anchor="middle" class="label">Zona de descanso despejada</text>

      <rect x="770" y="180" width="70" height="95" rx="12" fill="#DDECF2" stroke="#1D5D82" stroke-width="5"/>
      <circle cx="805" cy="214" r="10" fill="#287A68"/>
      <text x="805" y="315" text-anchor="middle" class="label">Monitor</text>
      <text x="805" y="346" text-anchor="middle" class="small">estable y alejado</text>

      <circle cx="85" cy="160" r="58" fill="#D85D4A" opacity=".25"/>
      <path d="M55 150 C55 112 90 100 112 126 C130 148 110 170 100 181 V215 H70 V181 C58 170 50 162 55 150 Z" fill="#D85D4A" stroke="#607985" stroke-width="5"/>
      <text x="85" y="250" text-anchor="middle" class="label">Luz gradual</text>
      <text x="85" y="281" text-anchor="middle" class="small">y oscuridad al dormir</text>

      <rect x="490" y="500" width="345" height="70" rx="20" fill="#F2F7F9" stroke="#1D5D82" stroke-width="4"/>
      <rect x="515" y="511" width="36" height="49" rx="7" fill="#16313F"/>
      <path d="M570 524 H805 M570 546 H805" class="line"/>
      <text x="687" y="563" text-anchor="middle" class="small">DISPOSITIVOS FUERA</text>

      <rect x="5" y="500" width="300" height="70" rx="20" fill="#E6F3EE"/>
      <path d="M35 535 L62 560 L102 516" class="good"/>
      <text x="205" y="530" text-anchor="middle" class="label">Sin cables</text>
      <text x="205" y="559" text-anchor="middle" class="small">bajo el colchón</text>
    </g>

    <g transform="translate(70,805)">
      <rect width="840" height="112" rx="24" fill="#E8F0F4"/>
      <rect x="40" y="25" width="95" height="58" rx="12" fill="#DDECF2" stroke="#1D5D82" stroke-width="4"/>
      <line x1="62" y1="42" x2="62" y2="68" stroke="#1D5D82" stroke-width="5"/><line x1="88" y1="42" x2="88" y2="68" stroke="#1D5D82" stroke-width="5"/>
      <circle cx="180" cy="54" r="34" fill="#FFF3C9" stroke="#D18B39" stroke-width="5"/>
      <text x="180" y="62" text-anchor="middle" class="label">D</text>
      <text x="250" y="49" class="label">Router fuera del dormitorio</text>
      <text x="250" y="80" class="body">SPIRO Disc siempre delante</text>
    </g>
  </g>

  <rect x="260" y="1235" width="1880" height="125" rx="30" fill="#FFF3C9"/>
  <text x="1200" y="1284" text-anchor="middle" class="label">La rutina empieza con una decisión visible</text>
  <text x="1200" y="1323" text-anchor="middle" class="body">La Card acompaña al dispositivo · el Disc va delante del router · reparar y medir sigue siendo necesario</text>
</svg>
