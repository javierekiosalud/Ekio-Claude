<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img"><title>UN COCHE ELÉCTRICO TAMBIÉN TIENE UN MAPA</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#425d69"/></marker></defs><rect width="1800" height="1120" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#16313f"><text x="900" y="70" font-size="42" font-weight="700" text-anchor="middle" fill="#16313f">UN COCHE ELÉCTRICO TAMBIÉN TIENE UN MAPA</text><text x="900" y="118" font-size="25" font-weight="400" text-anchor="middle" fill="#16313f">Localiza las fuentes y la posición de los ocupantes; la distribución cambia según el modelo</text><rect x="470" y="175" width="650" height="720" rx="22" fill="#eef4f6" stroke="#b4c6cd" stroke-width="2"/><text x="795" y="214" font-size="25" font-weight="700" text-anchor="middle" fill="#16313f">PARTE DELANTERA</text><rect x="570" y="245" width="450" height="70" rx="22" fill="#d5e6ee" stroke="#b4c6cd" stroke-width="2"/><text x="795" y="289" font-size="23" font-weight="700" text-anchor="middle" fill="#16313f">Motor / inversor, según modelo</text><rect x="530" y="330" width="530" height="465" rx="30" fill="#fae4b6" opacity=".65" stroke="#ba8431" stroke-width="3" stroke-dasharray="12 9"/><rect x="585" y="375" width="135" height="145" rx="22" fill="white" stroke="#b4c6cd" stroke-width="2"/><circle cx="652" cy="412" r="23" fill="#708d9b"/><path d="M615 495Q652 407 690 495" fill="#708d9b"/><rect x="870" y="375" width="135" height="145" rx="22" fill="white" stroke="#b4c6cd" stroke-width="2"/><circle cx="937" cy="412" r="23" fill="#708d9b"/><path d="M900 495Q937 407 975 495" fill="#708d9b"/><rect x="585" y="600" width="135" height="145" rx="22" fill="white" stroke="#b4c6cd" stroke-width="2"/><circle cx="652" cy="637" r="23" fill="#708d9b"/><path d="M615 720Q652 632 690 720" fill="#708d9b"/><rect x="870" y="600" width="135" height="145" rx="22" fill="white" stroke="#b4c6cd" stroke-width="2"/><circle cx="937" cy="637" r="23" fill="#708d9b"/><path d="M900 720Q937 632 975 720" fill="#708d9b"/><text x="795" y="827" font-size="25" font-weight="700" text-anchor="middle" fill="#16313f">Batería y cableado bajo el suelo</text><text x="70" y="280" font-size="25" font-weight="400" text-anchor="start" fill="#16313f">El campo depende de las</text><text x="70" y="317" font-size="25" font-weight="400" text-anchor="start" fill="#16313f">corrientes y de su recorrido,</text><text x="70" y="354" font-size="25" font-weight="400" text-anchor="start" fill="#16313f">no solo de sentarse sobre</text><text x="70" y="391" font-size="25" font-weight="400" text-anchor="start" fill="#16313f">una batería.</text><text x="70" y="540" font-size="25" font-weight="400" text-anchor="start" fill="#16313f">Aceleración y frenada</text><text x="70" y="577" font-size="25" font-weight="400" text-anchor="start" fill="#16313f">regenerativa cambian las</text><text x="70" y="614" font-size="25" font-weight="400" text-anchor="start" fill="#16313f">condiciones de medida.</text><text x="1185" y="265" font-size="25" font-weight="400" text-anchor="start" fill="#16313f">PROPUESTA COMERCIAL DE EKIO</text><rect x="1180" y="305" width="550" height="150" rx="22" fill="#e8f3ed" stroke="#b4c6cd" stroke-width="2"/><text x="1210" y="350" font-size="30" font-weight="700" text-anchor="start" fill="#16313f">Tres Square X</text><text x="1210" y="397" font-size="26" font-weight="400" text-anchor="start" fill="#16313f">o un Disc X o un Disc Ultra.</text><text x="1185" y="520" font-size="24" font-weight="400" text-anchor="start" fill="#16313f">Son alternativas de uso propuestas</text><text x="1185" y="557" font-size="24" font-weight="400" text-anchor="start" fill="#16313f">por EKIO; esta configuración no</text><text x="1185" y="594" font-size="24" font-weight="400" text-anchor="start" fill="#16313f">tiene validación clínica.</text><text x="1185" y="631" font-size="24" font-weight="400" text-anchor="start" fill="#16313f"></text><text x="1185" y="668" font-size="24" font-weight="400" text-anchor="start" fill="#16313f">La ubicación se revisa para cada</text><text x="1185" y="705" font-size="24" font-weight="400" text-anchor="start" fill="#16313f">vehículo. No se conectan a la batería</text><text x="1185" y="742" font-size="24" font-weight="400" text-anchor="start" fill="#16313f">ni a los cables del automóvil.</text><rect x="65" y="935" width="1670" height="120" rx="22" fill="#eef4f6" stroke="#b4c6cd" stroke-width="2"/><text x="900" y="982" font-size="26" font-weight="700" text-anchor="middle" fill="#16313f">FIJACIÓN SEGURA · PEDALES Y AIRBAGS LIBRES · MEDICIÓN POR UN ACOMPAÑANTE</text><text x="900" y="1027" font-size="24" font-weight="400" text-anchor="middle" fill="#16313f">Anota asiento, estado del vehículo, instrumento y unidades. No atribuyas síntomas al coche sin valoración.</text><text x="900" y="1090" font-size="20" font-weight="400" text-anchor="middle" fill="#16313f">Fuentes del campo: JRC (2020). Selección SPIRO: protocolo comercial de EKIO, distinto del ensayo Power 19 de Machado (2025).</text></g></svg>