<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1420" viewBox="0 0 2400 1420" role="img" aria-labelledby="title desc">
<title id="title">El espectro electromagnético</title><desc id="desc">Diagrama desde radio y microondas hasta rayos gamma, con luz visible ampliada y ejemplos domésticos.</desc><defs>
<style>
  .t{font:700 62px Arial,sans-serif;fill:#16313F}.st{font:400 29px Arial,sans-serif;fill:#425D69}
  .h{font:700 34px Arial,sans-serif;fill:#16313F}.b{font:400 25px Arial,sans-serif;fill:#314B57}
  .s{font:400 21px Arial,sans-serif;fill:#425D69}.tag{font:700 19px Arial,sans-serif;letter-spacing:1px}
  .panel{fill:#F8FBFC;stroke:#B9CBD3;stroke-width:3}.blue{fill:#E7F1F6;stroke:#1D5D82;stroke-width:3}
  .green{fill:#E9F5F1;stroke:#287A68;stroke-width:3}.orange{fill:#FFF2E8;stroke:#C25A2A;stroke-width:3}
</style>

<marker id="ab" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#1D5D82"/></marker>
<marker id="ag" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#287A68"/></marker>
<marker id="ao" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#C25A2A"/></marker>
</defs><rect width="2400" height="1420" fill="white"/>
<text x="1200" y="88" text-anchor="middle" class="t">EL ESPECTRO ELECTROMAGNÉTICO</text>
<text x="1200" y="138" text-anchor="middle" class="st">La misma familia de ondas, con frecuencias y longitudes de onda muy diferentes</text>
<text x="100" y="242" class="tag" fill="#1D5D82">MENOR FRECUENCIA · MAYOR LONGITUD DE ONDA</text><text x="2300" y="242" text-anchor="end" class="tag" fill="#C25A2A">MAYOR FRECUENCIA · MENOR LONGITUD DE ONDA</text>
<path d="M120 280H2280" stroke="#425D69" stroke-width="6" marker-end="url(#ao)"/>
<g transform="translate(100 340)">
 <rect width="500" height="300" fill="#C9DCE6"/><rect x="500" width="330" height="300" fill="#9DCFC2"/><rect x="830" width="330" height="300" fill="#F2C879"/><rect x="1160" width="180" height="300" fill="url(#vis)"/><rect x="1340" width="310" height="300" fill="#D8B6D8"/><rect x="1650" width="330" height="300" fill="#A9C2E0"/><rect x="1980" width="220" height="300" fill="#C999A7"/>
 <g text-anchor="middle" class="h"><text x="250" y="105">RADIO</text><text x="665" y="105">MICROONDAS</text><text x="995" y="105">INFRARROJO</text><text x="1250" y="95" transform="rotate(-90 1250 95)">VISIBLE</text><text x="1495" y="105">ULTRAVIOLETA</text><text x="1815" y="105">RAYOS X</text><text x="2090" y="105">GAMMA</text></g>
 <g text-anchor="middle" class="s"><text x="250" y="245">km → m</text><text x="665" y="245">m → mm</text><text x="995" y="245">1 mm → 700 nm</text><text x="1495" y="245">380 → 10 nm</text><text x="1815" y="245">10 → 0,01 nm</text><text x="2090" y="245">&lt; 0,01 nm</text></g>
</g>
<defs><linearGradient id="vis" x1="0" x2="1"><stop offset="0" stop-color="#CF3B36"/><stop offset=".15" stop-color="#F18A3E"/><stop offset=".3" stop-color="#F0D648"/><stop offset=".5" stop-color="#50B45A"/><stop offset=".68" stop-color="#27A5C7"/><stop offset=".84" stop-color="#3455C5"/><stop offset="1" stop-color="#7A3DB8"/></linearGradient></defs>
<g transform="translate(130 730)">
 <rect width="620" height="160" rx="24" class="blue"/><text x="35" y="45" class="tag" fill="#1D5D82">RED ELÉCTRICA · 50 Hz</text><text x="35" y="88" class="b">Campos de frecuencia extremadamente baja</text><text x="35" y="125" class="s">La longitud de onda sería enorme; importa la fuente cercana.</text>
 <rect x="680" width="620" height="160" rx="24" class="green"/><text x="715" y="45" class="tag" fill="#287A68">RADAR · MÓVIL · WI-FI</text><text x="715" y="88" class="b">Radio y microondas</text><text x="715" y="125" class="s">Radar: bandas diversas · Wi-Fi: 2,4 / 5 / 6 GHz</text>
 <rect x="1360" width="780" height="160" rx="24" class="orange"/><text x="1395" y="45" class="tag" fill="#C25A2A">LA FRANJA QUE VEN TUS OJOS</text><text x="1395" y="88" class="b">Rojo ≈ 700 nm → violeta ≈ 380 nm</text><text x="1395" y="125" class="s">Por debajo queda el UV; por encima, el infrarrojo.</text>
</g>
<path d="M140 1010H1690" stroke="#287A68" stroke-width="18"/><path d="M1690 1010H2260" stroke="#C25A2A" stroke-width="18"/>
<text x="820" y="1065" text-anchor="middle" class="h" fill="#287A68">RADIACIÓN NO IONIZANTE</text><text x="1880" y="1065" text-anchor="middle" class="h" fill="#C25A2A">RADIACIÓN IONIZANTE</text>
<text x="1500" y="1110" text-anchor="middle" class="s">La frontera es aproximada y se sitúa en la región ultravioleta de mayor energía.</text>
<rect x="150" y="1190" width="2100" height="125" rx="25" fill="#EEF3F5"/>
<text x="1200" y="1240" text-anchor="middle" class="h">Frecuencia y longitud de onda cambian en sentido contrario</text><text x="1200" y="1285" text-anchor="middle" class="s">En vacío: f = c / λ · esquema conceptual, bandas no a escala · las microondas forman parte de la radiofrecuencia</text>
</svg>