<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img"><title>MÁS TIEMPO FUERA: UN RESULTADO CONCRETO</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#425d69"/></marker></defs><rect width="1800" height="1050" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#16313f"><text x="900" y="70" font-size="42" font-weight="700" text-anchor="middle" fill="#16313f">MÁS TIEMPO FUERA: UN RESULTADO CONCRETO</text><text x="900" y="118" font-size="25" font-weight="400" text-anchor="middle" fill="#16313f">Niños que desarrollaron miopía en tres años, entre quienes no la tenían al inicio</text><line x1="540.0" y1="235" x2="540.0" y2="640" stroke="#dbe5ea" stroke-width="2"/><text x="540.0" y="686" font-size="24" font-weight="400" text-anchor="middle" fill="#16313f">0 %</text><line x1="760.0" y1="235" x2="760.0" y2="640" stroke="#dbe5ea" stroke-width="2"/><text x="760.0" y="686" font-size="24" font-weight="400" text-anchor="middle" fill="#16313f">20 %</text><line x1="980.0" y1="235" x2="980.0" y2="640" stroke="#dbe5ea" stroke-width="2"/><text x="980.0" y="686" font-size="24" font-weight="400" text-anchor="middle" fill="#16313f">40 %</text><line x1="1200.0" y1="235" x2="1200.0" y2="640" stroke="#dbe5ea" stroke-width="2"/><text x="1200.0" y="686" font-size="24" font-weight="400" text-anchor="middle" fill="#16313f">60 %</text><line x1="1420.0" y1="235" x2="1420.0" y2="640" stroke="#dbe5ea" stroke-width="2"/><text x="1420.0" y="686" font-size="24" font-weight="400" text-anchor="middle" fill="#16313f">80 %</text><line x1="1640.0" y1="235" x2="1640.0" y2="640" stroke="#dbe5ea" stroke-width="2"/><text x="1640.0" y="686" font-size="24" font-weight="400" text-anchor="middle" fill="#16313f">100 %</text><text x="75" y="325" font-size="29" font-weight="700" text-anchor="start" fill="#16313f">Más actividad exterior</text><text x="75" y="368" font-size="24" font-weight="400" text-anchor="start" fill="#16313f">259 de 853 niños</text><rect x="540" y="295" width="334.4" height="95" rx="8" fill="#287a68"/><text x="894.4" y="355" font-size="34" font-weight="700" text-anchor="start" fill="#16313f">30,4 %</text><text x="75" y="525" font-size="29" font-weight="700" text-anchor="start" fill="#16313f">Rutina habitual</text><text x="75" y="568" font-size="24" font-weight="400" text-anchor="start" fill="#16313f">287 de 726 niños</text><rect x="540" y="495" width="434.5" height="95" rx="8" fill="#657f8e"/><text x="994.5" y="555" font-size="34" font-weight="700" text-anchor="start" fill="#16313f">39,5 %</text><rect x="70" y="740" width="1660" height="165" rx="22" fill="#e8f3ed" stroke="#b4c6cd" stroke-width="2"/><text x="110" y="788" font-size="34" font-weight="700" text-anchor="start" fill="#16313f">9,1 puntos porcentuales de diferencia</text><text x="110" y="831" font-size="25" font-weight="400" text-anchor="start" fill="#16313f">12 escuelas; se añadió una clase exterior de 40 minutos al día y se animó a las familias a salir.</text><text x="110" y="869" font-size="25" font-weight="400" text-anchor="start" fill="#16313f">Un resultado sobre aparición de miopía; no mide daño electromagnético ni cura una miopía existente.</text><text x="900" y="957" font-size="28" font-weight="700" text-anchor="middle" fill="#16313f">TU ACCIÓN: RESERVA HOY UN RATO DE JUEGO AL AIRE LIBRE.</text><text x="900" y="1010" font-size="22" font-weight="400" text-anchor="middle" fill="#16313f">He et al., JAMA (2015). DOI: 10.1001/jama.2015.10803. Incidencia acumulada; ensayo aleatorizado por escuelas.</text></g></svg>