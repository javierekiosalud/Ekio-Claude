<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1380" viewBox="0 0 2200 1380" role="img" aria-labelledby="title desc">
  <title id="title">Cuatro habitaciones y sus prioridades de higiene electromagnética</title>
  <desc id="desc">Comparación del dormitorio, la cocina, el salón y el despacho según el tiempo, la distancia, la acumulación y la cercanía, con acciones prácticas y formatos SPIRO que se deben valorar.</desc>
  <defs>
    <style>
      .title { font: 700 60px Arial, Helvetica, sans-serif; fill: #16313F; }
      .subtitle { font: 400 28px Arial, Helvetica, sans-serif; fill: #4B646F; }
      .room { font: 700 38px Arial, Helvetica, sans-serif; fill: #16313F; }
      .priority { font: 700 23px Arial, Helvetica, sans-serif; letter-spacing: .7px; }
      .label { font: 700 25px Arial, Helvetica, sans-serif; fill: #213D49; }
      .body { font: 400 23px Arial, Helvetica, sans-serif; fill: #3F5964; }
      .small { font: 600 20px Arial, Helvetica, sans-serif; fill: #4B646F; }
      .line { fill: none; stroke: #607985; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .furniture { fill: #EEF3F5; stroke: #607985; stroke-width: 5; }
    </style>
  </defs>
  <rect width="2200" height="1380" fill="#FFFFFF"/>
  <text x="1100" y="78" text-anchor="middle" class="title">CUATRO HABITACIONES, CUATRO PRIORIDADES</text>
  <text x="1100" y="125" text-anchor="middle" class="subtitle">El método OASIS cambia de énfasis según lo que haces en cada espacio</text>

  <!-- bedroom -->
  <g transform="translate(70,190)">
    <rect width="1000" height="500" rx="32" fill="#F4F9FA" stroke="#AFC3CC" stroke-width="4"/>
    <rect x="35" y="30" width="250" height="46" rx="23" fill="#DCECF4"/>
    <text x="160" y="61" text-anchor="middle" class="priority" fill="#1D5D82">NOCHE · TIEMPO</text>
    <text x="35" y="135" class="room">DORMITORIO</text>
    <rect x="60" y="210" width="330" height="190" rx="24" class="furniture"/>
    <rect x="60" y="210" width="330" height="52" rx="20" fill="#DCE7EB" stroke="#607985" stroke-width="5"/>
    <line x1="225" y1="262" x2="225" y2="400" class="line" opacity="0.45"/>
    <rect x="420" y="280" width="55" height="80" rx="9" fill="#FFFFFF" stroke="#607985" stroke-width="4"/>
    <path d="M447 280 v-80 m-38 0 h76 l-22 -50 h-32 z" class="furniture"/>
    <circle cx="510" cy="230" r="27" fill="#C25A2A"/><text x="510" y="239" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#FFFFFF">R</text>
    <text x="560" y="214" class="label">Qué revisar</text>
    <text x="560" y="252" class="body">Móvil · cables · router · luz</text>
    <text x="560" y="318" class="label">Primer cambio</text>
    <text x="560" y="356" class="body">Aleja el móvil y despeja la mesita</text>
    <rect x="545" y="402" width="390" height="58" rx="22" fill="#E4F3EE" stroke="#287A68" stroke-width="3"/>
    <text x="740" y="439" text-anchor="middle" class="label" fill="#287A68">Valora CARD + DISC</text>
  </g>

  <!-- kitchen -->
  <g transform="translate(1130,190)">
    <rect width="1000" height="500" rx="32" fill="#FCF8F3" stroke="#D5B9A9" stroke-width="4"/>
    <rect x="35" y="30" width="270" height="46" rx="23" fill="#FFF0E7"/>
    <text x="170" y="61" text-anchor="middle" class="priority" fill="#C25A2A">USO · DISTANCIA</text>
    <text x="35" y="135" class="room">COCINA</text>
    <rect x="55" y="215" width="350" height="145" rx="15" class="furniture"/>
    <circle cx="145" cy="288" r="43" fill="none" stroke="#607985" stroke-width="5"/>
    <circle cx="305" cy="288" r="43" fill="none" stroke="#607985" stroke-width="5"/>
    <rect x="120" y="380" width="220" height="75" rx="10" class="furniture"/>
    <rect x="145" y="398" width="120" height="40" rx="6" fill="#FFFFFF" stroke="#607985" stroke-width="3"/>
    <path d="M430 285 H500 M465 250 L500 285 L465 320" class="line" stroke="#C25A2A"/>
    <text x="550" y="214" class="label">Qué revisar</text>
    <text x="550" y="252" class="body">Inducción · microondas · motores</text>
    <text x="550" y="318" class="label">Primer cambio</text>
    <text x="550" y="356" class="body">Da un paso atrás mientras funcionan</text>
    <rect x="535" y="402" width="420" height="58" rx="22" fill="#FFF0E7" stroke="#C25A2A" stroke-width="3"/>
    <text x="745" y="439" text-anchor="middle" class="label" fill="#C25A2A">Valora DISC + STROOM</text>
  </g>

  <!-- living room -->
  <g transform="translate(70,735)">
    <rect width="1000" height="500" rx="32" fill="#F8F6FB" stroke="#C4B6D4" stroke-width="4"/>
    <rect x="35" y="30" width="330" height="46" rx="23" fill="#EEE9F4"/>
    <text x="200" y="61" text-anchor="middle" class="priority" fill="#795E9B">DESCANSO · ACUMULACIÓN</text>
    <text x="35" y="135" class="room">SALÓN</text>
    <rect x="55" y="250" width="350" height="170" rx="45" class="furniture"/>
    <line x1="170" y1="250" x2="170" y2="420" class="line" opacity="0.45"/>
    <line x1="290" y1="250" x2="290" y2="420" class="line" opacity="0.45"/>
    <rect x="420" y="210" width="90" height="55" rx="8" fill="#FFFFFF" stroke="#607985" stroke-width="4"/>
    <path d="M438 210 q27 -50 54 0 M448 210 q17 -30 34 0" fill="none" stroke="#C25A2A" stroke-width="4"/>
    <path d="M465 275 V400" stroke="#C25A2A" stroke-width="5" stroke-dasharray="12 10"/>
    <text x="555" y="214" class="label">Qué revisar</text>
    <text x="555" y="252" class="body">Router · repetidores · TV · regletas</text>
    <text x="555" y="318" class="label">Primer cambio</text>
    <text x="555" y="356" class="body">Separa las fuentes del sofá</text>
    <rect x="540" y="402" width="410" height="58" rx="22" fill="#EEE9F4" stroke="#795E9B" stroke-width="3"/>
    <text x="745" y="439" text-anchor="middle" class="label" fill="#795E9B">DISC DELANTE DEL ROUTER</text>
  </g>

  <!-- office -->
  <g transform="translate(1130,735)">
    <rect width="1000" height="500" rx="32" fill="#F4F9F7" stroke="#ACCCC2" stroke-width="4"/>
    <rect x="35" y="30" width="330" height="46" rx="23" fill="#E4F3EE"/>
    <text x="200" y="61" text-anchor="middle" class="priority" fill="#287A68">JORNADA · CERCANÍA</text>
    <text x="35" y="135" class="room">DESPACHO</text>
    <rect x="55" y="300" width="400" height="45" rx="8" class="furniture"/>
    <line x1="100" y1="345" x2="80" y2="440" class="line"/>
    <line x1="410" y1="345" x2="430" y2="440" class="line"/>
    <rect x="170" y="210" width="175" height="100" rx="10" fill="#FFFFFF" stroke="#607985" stroke-width="5"/>
    <path d="M150 315 H365" class="line"/>
    <rect x="370" y="350" width="95" height="55" rx="8" fill="#FFFFFF" stroke="#607985" stroke-width="4"/>
    <path d="M390 350 q27 -45 55 0" fill="none" stroke="#C25A2A" stroke-width="4"/>
    <text x="555" y="214" class="label">Qué revisar</text>
    <text x="555" y="252" class="body">Cargadores · portátil · móvil · Wi-Fi</text>
    <text x="555" y="318" class="label">Primer cambio</text>
    <text x="555" y="356" class="body">Ordena cables y aleja transformadores</text>
    <rect x="540" y="402" width="410" height="58" rx="22" fill="#E4F3EE" stroke="#287A68" stroke-width="3"/>
    <text x="745" y="439" text-anchor="middle" class="label" fill="#287A68">Valora CARD · DISC · SQUARE</text>
  </g>

  <rect x="510" y="1270" width="1180" height="66" rx="28" fill="#E8F0F4" stroke="#1D5D82" stroke-width="3"/>
  <text x="1100" y="1312" text-anchor="middle" class="label" fill="#1D5D82">OBSERVA → ALEJA O APAGA → SANEA → INTEGRA → SINCRONIZA</text>
</svg>
