<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1420" viewBox="0 0 2400 1420" role="img" aria-labelledby="title desc">
  <title id="title">El pacto del primer móvil</title>
  <desc id="desc">Cinco decisiones familiares organizan el primer móvil: un lugar de descanso, un horario, distancia durante el uso, conexiones con función y una SPIRO Card correctamente colocada.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#607985"/></marker>
    <style>
      .title { font: 700 60px Arial, Helvetica, sans-serif; fill: #16313F; }
      .subtitle { font: 400 28px Arial, Helvetica, sans-serif; fill: #4B646F; }
      .step { font: 700 30px Arial, Helvetica, sans-serif; fill: #16313F; }
      .body { font: 400 22px Arial, Helvetica, sans-serif; fill: #3F5964; }
      .small { font: 600 19px Arial, Helvetica, sans-serif; fill: #4B646F; }
      .number { font: 700 26px Arial, Helvetica, sans-serif; fill: #FFFFFF; }
      .card { fill: #F8FBFC; stroke: #B4C6CD; stroke-width: 4; }
      .line { fill: none; stroke: #607985; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .icon { fill: none; stroke: #1D5D82; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="2400" height="1420" fill="#FFFFFF"/>
  <text x="1200" y="88" text-anchor="middle" class="title">EL PACTO DEL PRIMER MÓVIL</text>
  <text x="1200" y="137" text-anchor="middle" class="subtitle">Cinco decisiones escritas con el menor antes de que el aparato se mude a la almohada</text>

  <g transform="translate(80,245)">
    <g>
      <rect width="410" height="720" rx="30" class="card"/>
      <circle cx="58" cy="58" r="31" fill="#B94D3E"/><text x="58" y="68" text-anchor="middle" class="number">1</text>
      <text x="205" y="138" text-anchor="middle" class="step">Tiene casa</text>
      <path d="M105 330 L205 245 L305 330 V465 H105 Z" fill="#F7E4E1" stroke="#B94D3E" stroke-width="7" stroke-linejoin="round"/>
      <rect x="175" y="365" width="60" height="100" rx="8" fill="#FFFFFF" stroke="#B94D3E" stroke-width="6"/>
      <rect x="255" y="350" width="52" height="85" rx="10" fill="#16313F"/>
      <text x="205" y="535" text-anchor="middle" class="body">Elegid dónde descansa</text>
      <text x="205" y="569" text-anchor="middle" class="body">y carga por la noche.</text>
      <text x="205" y="633" text-anchor="middle" class="small">Fuera del dormitorio</text>
    </g>
    <path d="M430 360 H475" class="line" marker-end="url(#arrow)"/>

    <g transform="translate(490,0)">
      <rect width="410" height="720" rx="30" class="card"/>
      <circle cx="58" cy="58" r="31" fill="#D18B39"/><text x="58" y="68" text-anchor="middle" class="number">2</text>
      <text x="205" y="138" text-anchor="middle" class="step">Tiene horario</text>
      <circle cx="205" cy="355" r="108" fill="#FFF3C9" stroke="#D18B39" stroke-width="7"/>
      <path d="M205 268 V355 L270 394" fill="none" stroke="#D18B39" stroke-width="11" stroke-linecap="round"/>
      <circle cx="205" cy="355" r="13" fill="#D18B39"/>
      <text x="205" y="535" text-anchor="middle" class="body">Acordad una hora</text>
      <text x="205" y="569" text-anchor="middle" class="body">de cierre familiar.</text>
      <text x="205" y="633" text-anchor="middle" class="small">El adulto también cumple</text>
    </g>
    <path d="M920 360 H965" class="line" marker-end="url(#arrow)"/>

    <g transform="translate(980,0)">
      <rect width="410" height="720" rx="30" class="card"/>
      <circle cx="58" cy="58" r="31" fill="#287A68"/><text x="58" y="68" text-anchor="middle" class="number">3</text>
      <text x="205" y="138" text-anchor="middle" class="step">Tiene distancia</text>
      <rect x="70" y="270" width="82" height="145" rx="18" fill="#16313F"/>
      <rect x="84" y="288" width="54" height="96" rx="8" fill="#6FA4BB"/>
      <path d="M175 342 H315" class="line" marker-end="url(#arrow)"/>
      <path d="M327 275 V420 M307 275 H347 M307 420 H347" stroke="#287A68" stroke-width="7" fill="none"/>
      <text x="205" y="535" text-anchor="middle" class="body">Altavoz y superficie</text>
      <text x="205" y="569" text-anchor="middle" class="body">cuando sea posible.</text>
      <text x="205" y="633" text-anchor="middle" class="small">Nunca bajo la almohada</text>
    </g>
    <path d="M1410 360 H1455" class="line" marker-end="url(#arrow)"/>

    <g transform="translate(1470,0)">
      <rect width="410" height="720" rx="30" class="card"/>
      <circle cx="58" cy="58" r="31" fill="#795E9B"/><text x="58" y="68" text-anchor="middle" class="number">4</text>
      <text x="205" y="138" text-anchor="middle" class="step">Tiene conexiones</text>
      <circle cx="205" cy="355" r="34" fill="#795E9B"/>
      <path d="M125 335 C160 295 250 295 285 335 M95 300 C150 235 260 235 315 300" fill="none" stroke="#795E9B" stroke-width="10" stroke-linecap="round"/>
      <path d="M135 445 L275 265" stroke="#B94D3E" stroke-width="10" stroke-linecap="round"/>
      <text x="205" y="535" text-anchor="middle" class="body">Activa cada radio</text>
      <text x="205" y="569" text-anchor="middle" class="body">cuando tenga una función.</text>
      <text x="205" y="633" text-anchor="middle" class="small">Apaga al terminar</text>
    </g>
    <path d="M1900 360 H1945" class="line" marker-end="url(#arrow)"/>

    <g transform="translate(1960,0)">
      <rect width="280" height="720" rx="30" fill="#E8F0F4" stroke="#1D5D82" stroke-width="4"/>
      <circle cx="58" cy="58" r="31" fill="#1D5D82"/><text x="58" y="68" text-anchor="middle" class="number">5</text>
      <text x="140" y="138" text-anchor="middle" class="step">Accesorios</text>
      <rect x="84" y="250" width="112" height="195" rx="22" fill="#16313F"/>
      <rect x="101" y="271" width="78" height="120" rx="10" fill="#6FA4BB"/>
      <rect x="105" y="345" width="70" height="104" rx="10" fill="#FFF3C9" stroke="#D18B39" stroke-width="5"/>
      <text x="140" y="408" text-anchor="middle" class="step">S</text>
      <text x="140" y="535" text-anchor="middle" class="body">Card detrás,</text>
      <text x="140" y="569" text-anchor="middle" class="body">entre funda</text>
      <text x="140" y="603" text-anchor="middle" class="body">y dispositivo.</text>
    </g>
  </g>

  <g transform="translate(210,1040)">
    <rect width="1980" height="250" rx="34" fill="#F2F7F9" stroke="#1D5D82" stroke-width="4"/>
    <text x="990" y="63" text-anchor="middle" class="step">La regla que sostiene las cinco</text>
    <text x="990" y="116" text-anchor="middle" class="body">Si el móvil interrumpe el sueño, la conversación o la seguridad, se revisa el pacto con el menor.</text>
    <rect x="240" y="157" width="1500" height="60" rx="22" fill="#E6F3EE"/>
    <text x="990" y="196" text-anchor="middle" class="small">Si incorporáis SPIRO, seguid su ficha. Conservad el horario y la distancia acordados.</text>
  </g>
</svg>
