<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1320" viewBox="0 0 2400 1320" role="img" aria-labelledby="title desc">
  <title id="title">El camino que dio origen al libro de electrobiofotónica</title>
  <desc id="desc">Recorrido de Javier Andrés desde el inicio de EKIO y su trabajo con personas con sensibilidad química múltiple y electrohipersensibilidad hasta la observación de los hogares, SPIRO, EKIO Light y la creación de esta guía.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#607985"/></marker>
    <style>
      .title { font: 700 60px Arial, Helvetica, sans-serif; fill: #16313F; }
      .subtitle { font: 400 28px Arial, Helvetica, sans-serif; fill: #4B646F; }
      .step { font: 700 28px Arial, Helvetica, sans-serif; fill: #16313F; }
      .date { font: 700 23px Arial, Helvetica, sans-serif; fill: #FFFFFF; }
      .body { font: 400 21px Arial, Helvetica, sans-serif; fill: #3F5964; }
      .small { font: 600 19px Arial, Helvetica, sans-serif; fill: #4B646F; }
      .card { fill: #F8FBFC; stroke: #B4C6CD; stroke-width: 4; }
      .line { fill: none; stroke: #607985; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .good { fill: none; stroke: #287A68; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="2400" height="1320" fill="#FFFFFF"/>
  <text x="1200" y="88" text-anchor="middle" class="title">EL CAMINO QUE DIO ORIGEN A ESTE LIBRO</text>
  <text x="1200" y="138" text-anchor="middle" class="subtitle">Escuchar a las personas cambió mi manera de observar una casa y de buscar soluciones</text>

  <path d="M205 440 H2195" class="line" marker-end="url(#arrow)"/>

  <g transform="translate(75,240)">
    <rect width="340" height="590" rx="30" class="card"/>
    <rect x="85" y="-26" width="170" height="62" rx="22" fill="#1D5D82"/>
    <text x="170" y="15" text-anchor="middle" class="date">2011</text>
    <circle cx="170" cy="198" r="76" fill="#DDECF2" stroke="#1D5D82" stroke-width="7"/>
    <path d="M125 198 H215 M170 153 V243" class="line"/>
    <text x="170" y="322" text-anchor="middle" class="step">EKIO</text>
    <text x="170" y="365" text-anchor="middle" class="body">Empiezo a dirigir</text>
    <text x="170" y="397" text-anchor="middle" class="body">mi proyecto profesional</text>
    <text x="170" y="474" text-anchor="middle" class="small">Ayudar, estudiar</text>
    <text x="170" y="504" text-anchor="middle" class="small">y buscar respuestas</text>
  </g>

  <g transform="translate(455,240)">
    <rect width="340" height="590" rx="30" class="card"/>
    <rect x="55" y="-26" width="230" height="62" rx="22" fill="#287A68"/>
    <text x="170" y="15" text-anchor="middle" class="date">2011–2012</text>
    <circle cx="140" cy="184" r="46" fill="#E6F3EE" stroke="#287A68" stroke-width="6"/>
    <circle cx="210" cy="184" r="46" fill="#E6F3EE" stroke="#287A68" stroke-width="6"/>
    <path d="M95 274 C110 225 230 225 245 274" class="good"/>
    <text x="170" y="322" text-anchor="middle" class="step">Escuchar</text>
    <text x="170" y="365" text-anchor="middle" class="body">Sensibilidad química</text>
    <text x="170" y="397" text-anchor="middle" class="body">y electrohipersensibilidad</text>
    <text x="170" y="474" text-anchor="middle" class="small">El sufrimiento invisible</text>
    <text x="170" y="504" text-anchor="middle" class="small">se convierte en búsqueda</text>
  </g>

  <g transform="translate(835,240)">
    <rect width="340" height="590" rx="30" class="card"/>
    <circle cx="170" cy="198" r="76" fill="#FFF0D8" stroke="#D18B39" stroke-width="7"/>
    <path d="M116 220 V152 H224 V244 H140 V185 H197" class="line"/>
    <circle cx="212" cy="165" r="13" fill="#B94D3E"/>
    <text x="170" y="322" text-anchor="middle" class="step">Observar</text>
    <text x="170" y="365" text-anchor="middle" class="body">Camas, paredes, cables,</text>
    <text x="170" y="397" text-anchor="middle" class="body">router y zonas de descanso</text>
    <text x="170" y="474" text-anchor="middle" class="small">La casa empieza</text>
    <text x="170" y="504" text-anchor="middle" class="small">a mostrar su mapa invisible</text>
  </g>

  <g transform="translate(1215,240)">
    <rect width="340" height="590" rx="30" class="card"/>
    <circle cx="170" cy="198" r="76" fill="#EEE9F4" stroke="#795E9B" stroke-width="7"/>
    <rect x="145" y="132" width="50" height="100" rx="11" fill="#16313F"/>
    <circle cx="170" cy="217" r="5" fill="#FFFFFF"/>
    <circle cx="245" cy="198" r="32" fill="#FFF3C9" stroke="#D18B39" stroke-width="5"/>
    <text x="170" y="322" text-anchor="middle" class="step">Integrar SPIRO</text>
    <text x="170" y="365" text-anchor="middle" class="body">Tecnología aplicada</text>
    <text x="170" y="397" text-anchor="middle" class="body">a dispositivos y espacios</text>
    <text x="170" y="474" text-anchor="middle" class="small">Card · Square · Disc</text>
    <text x="170" y="504" text-anchor="middle" class="small">según cada situación</text>
  </g>

  <g transform="translate(1595,240)">
    <rect width="340" height="590" rx="30" class="card"/>
    <circle cx="170" cy="198" r="76" fill="#F7E4E1" stroke="#B94D3E" stroke-width="7"/>
    <rect x="132" y="122" width="76" height="150" rx="12" fill="#D85D4A"/>
    <g fill="#FFF3C9"><circle cx="153" cy="153" r="9"/><circle cx="187" cy="153" r="9"/><circle cx="153" cy="187" r="9"/><circle cx="187" cy="187" r="9"/><circle cx="153" cy="221" r="9"/><circle cx="187" cy="221" r="9"/></g>
    <text x="170" y="322" text-anchor="middle" class="step">Crear EKIO Light</text>
    <text x="170" y="365" text-anchor="middle" class="body">Luz ambiental</text>
    <text x="170" y="397" text-anchor="middle" class="body">y fotobiomodulación</text>
    <text x="170" y="474" text-anchor="middle" class="small">Recuperar el día</text>
    <text x="170" y="504" text-anchor="middle" class="small">y aplicar luz con criterios</text>
  </g>

  <g transform="translate(1975,240)">
    <rect width="340" height="590" rx="30" fill="#E6F3EE" stroke="#287A68" stroke-width="4"/>
    <circle cx="170" cy="198" r="76" fill="#FFFFFF" stroke="#287A68" stroke-width="7"/>
    <path d="M112 143 H170 C198 143 220 160 220 184 V254 H162 C134 254 112 237 112 213 Z" fill="#E6F3EE" stroke="#287A68" stroke-width="6"/>
    <path d="M228 143 H170 C142 143 120 160 120 184 V254 H178 C206 254 228 237 228 213 Z" fill="#DDECF2" stroke="#1D5D82" stroke-width="6"/>
    <text x="170" y="322" text-anchor="middle" class="step">Compartir</text>
    <text x="170" y="365" text-anchor="middle" class="body">Electrobiofotónica</text>
    <text x="170" y="397" text-anchor="middle" class="body">y método OASIS</text>
    <text x="170" y="474" text-anchor="middle" class="small">Convertir la búsqueda</text>
    <text x="170" y="504" text-anchor="middle" class="small">en una guía práctica</text>
  </g>

  <g transform="translate(210,925)">
    <rect width="1980" height="245" rx="34" fill="#F2F7F9" stroke="#1D5D82" stroke-width="4"/>
    <text x="990" y="65" text-anchor="middle" class="step">UNA MISMA PREGUNTA RECORRE TODO EL CAMINO</text>
    <text x="990" y="126" text-anchor="middle" style="font:700 36px Arial,Helvetica,sans-serif;fill:#1D5D82">¿Cómo podemos preparar un entorno que acompañe mejor al organismo?</text>
    <text x="990" y="190" text-anchor="middle" class="body">Escuchar · observar · reducir · medir · integrar · sincronizar · compartir</text>
  </g>
</svg>
