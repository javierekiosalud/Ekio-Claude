<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1420" viewBox="0 0 2400 1420" role="img" aria-labelledby="title desc">
<title id="title">Cuatro lentes para mirar lo invisible</title><desc id="desc">Macroescala, microescala, nanoescala y escala de longitud de onda y frecuencia.</desc><defs>
<style>
  .t{font:700 62px Arial,sans-serif;fill:#16313F}.st{font:400 29px Arial,sans-serif;fill:#425D69}
  .h{font:700 34px Arial,sans-serif;fill:#16313F}.b{font:400 25px Arial,sans-serif;fill:#314B57}
  .s{font:400 21px Arial,sans-serif;fill:#425D69}.tag{font:700 19px Arial,sans-serif;letter-spacing:1px}
  .panel{fill:#F8FBFC;stroke:#B9CBD3;stroke-width:3}.blue{fill:#E7F1F6;stroke:#1D5D82;stroke-width:3}
  .green{fill:#E9F5F1;stroke:#287A68;stroke-width:3}.orange{fill:#FFF2E8;stroke:#C25A2A;stroke-width:3}
</style>

<marker id="ab" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#1D5D82"/></marker>
<marker id="ag" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#287A68"/></marker>
<marker id="ao" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#C25A2A"/></marker>
</defs><rect width="2400" height="1420" fill="white"/>
<text x="1200" y="92" text-anchor="middle" class="t">CUATRO LENTES PARA MIRAR LO INVISIBLE</text>
<text x="1200" y="142" text-anchor="middle" class="st">Tres escalas de tamaño y una escala para describir las ondas</text>
<g transform="translate(70 220)">
 <rect width="535" height="920" rx="28" class="panel"/><circle cx="267" cy="230" r="135" fill="#E7F1F6" stroke="#1D5D82" stroke-width="5"/>
 <path d="M145 275h245M205 275v-110h125v110M230 165v-65h75v65" fill="none" stroke="#1D5D82" stroke-width="12"/>
 <text x="267" y="415" text-anchor="middle" class="h">MACROESCALA</text><text x="267" y="457" text-anchor="middle" class="s">De metros a milímetros</text>
 <text x="55" y="530" class="b">Casa · persona · habitación</text><text x="55" y="575" class="b">cables · aparatos · distancias</text>
 <rect x="45" y="650" width="445" height="120" rx="20" class="blue"/><text x="267" y="700" text-anchor="middle" class="tag" fill="#1D5D82">A SIMPLE VISTA</text><text x="267" y="742" text-anchor="middle" class="s">Lo que ordenamos en el hogar</text>
</g>
<g transform="translate(645 220)">
 <rect width="535" height="920" rx="28" class="panel"/><circle cx="267" cy="230" r="135" fill="#E9F5F1" stroke="#287A68" stroke-width="5"/>
 <circle cx="267" cy="230" r="90" fill="none" stroke="#287A68" stroke-width="7"/><circle cx="267" cy="230" r="34" fill="#9DCFC2"/><circle cx="215" cy="195" r="12" fill="#287A68"/><circle cx="320" cy="260" r="15" fill="#287A68"/>
 <text x="267" y="415" text-anchor="middle" class="h">MICROESCALA</text><text x="267" y="457" text-anchor="middle" class="s">Milímetros y micrómetros</text>
 <text x="55" y="530" class="b">Tejidos · células · bacterias</text><text x="55" y="575" class="b">y orgánulos grandes</text>
 <rect x="45" y="650" width="445" height="120" rx="20" class="green"/><text x="267" y="700" text-anchor="middle" class="tag" fill="#287A68">MICROSCOPIO ÓPTICO</text><text x="267" y="742" text-anchor="middle" class="s">Resolución práctica ≈ 0,2 µm</text>
</g>
<g transform="translate(1220 220)">
 <rect width="535" height="920" rx="28" class="panel"/><circle cx="267" cy="230" r="135" fill="#FFF2E8" stroke="#C25A2A" stroke-width="5"/>
 <g stroke="#C25A2A" stroke-width="5" fill="#F7CDB9"><circle cx="205" cy="205" r="30"/><circle cx="290" cy="165" r="25"/><circle cx="330" cy="245" r="34"/><circle cx="235" cy="285" r="23"/><path d="M230 190l38-18M309 188l12 27M302 260l-42 18M221 257l-10-23"/></g>
 <text x="267" y="415" text-anchor="middle" class="h">NANOESCALA</text><text x="267" y="457" text-anchor="middle" class="s">Nanómetros y fracciones</text>
 <text x="55" y="530" class="b">Membranas · proteínas · ADN</text><text x="55" y="575" class="b">moléculas · átomos</text>
 <rect x="45" y="650" width="445" height="120" rx="20" class="orange"/><text x="267" y="700" text-anchor="middle" class="tag" fill="#C25A2A">MICROSCOPÍA ELECTRÓNICA</text><text x="267" y="742" text-anchor="middle" class="s">y otras técnicas moleculares</text>
</g>
<g transform="translate(1795 220)">
 <rect width="535" height="920" rx="28" class="panel"/><circle cx="267" cy="230" r="135" fill="#F2E8C8" stroke="#806C31" stroke-width="5"/>
 <path d="M125 230c40-100 80 100 120 0s80-100 120 0 80 100 120 0" fill="none" stroke="#806C31" stroke-width="10"/><path d="M145 330h245" stroke="#806C31" stroke-width="5" marker-end="url(#ab)"/><text x="267" y="360" text-anchor="middle" class="s">longitud de onda λ</text>
 <text x="267" y="415" text-anchor="middle" class="h">ONDAS</text><text x="267" y="457" text-anchor="middle" class="s">Longitud de onda y frecuencia</text>
 <text x="55" y="530" class="b">Radio · microondas · luz</text><text x="55" y="575" class="b">ultravioleta · rayos X · gamma</text>
 <rect x="45" y="650" width="445" height="150" rx="20" fill="#F7F1DD" stroke="#806C31" stroke-width="3"/><text x="267" y="700" text-anchor="middle" class="tag" fill="#806C31">NO ES TAMAÑO DE OBJETOS</text><text x="267" y="742" text-anchor="middle" class="s">Describe la oscilación del campo</text><text x="267" y="775" text-anchor="middle" class="s">y la energía de sus fotones</text>
</g>
<rect x="160" y="1200" width="2080" height="120" rx="25" fill="#EEF3F5"/>
<text x="1200" y="1250" text-anchor="middle" class="h">La unidad no crea el fenómeno: solo nos permite enfocarlo</text>
<text x="1200" y="1295" text-anchor="middle" class="s">1 mm = 1.000 µm · 1 µm = 1.000 nm · la luz visible tiene longitudes de onda de unos 380 a 700 nm</text>
</svg>